name: Sync LeetCode Solutions

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      
      - name: Check LeetCode secrets
        env:
            SESSION: ${{ secrets.LEETCODE_SESSION }}
            CSRF: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: |
            echo "SESSION length: ${#SESSION}"
            echo "CSRF length: ${#CSRF}"

            if [ -z "$SESSION" ]; then
            echo "ERROR: LEETCODE_SESSION is empty"
            exit 1
            fi

            if [ -z "$CSRF" ]; then
            echo "ERROR: LEETCODE_CSRF_TOKEN is empty"
            exit 1
            fi

            echo "Both secrets are present."

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..JYYQbVypOSWSozMHc3Uob7JeQdwbbl4QorXDnatv6jE }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.xVaGPmnudM7rIqkJFe2Qn32rNlkkqUeo}}
          LEETCODE_USERNAME: parth2099
        run: |
          python sync_leetcode.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add solutions/

          if git diff --cached --quiet; then
            echo "No new solutions."
          else
            git commit -m "Sync LeetCode solutions"
            git push
          fi