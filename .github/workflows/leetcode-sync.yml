name: Sync LeetCode Solutions

on:
  workflow_dispatch:

  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.xVaGPmnudM7rIqkJFe2Qn32rNlkkqUeo }}
          leetcode-session: ${{ secrets.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..JYYQbVypOSWSozMHc3Uob7JeQdwbbl4QorXDnatv6jE }}
          destination-folder: solutions
          verbose: true
          commit-header: "[LeetCode Sync]"